name: Build & Push Next.js Apps to OVH Registry

on:
  push:
    branches:
      - main
      - master
      - dev
      - staging

env:
  OVH_REGISTRY: ${{ secrets.OVH_REGISTRY_URL }}

jobs:
  # ──────────────────────────────────────────────
  # Matrix: runs once for admin, once for physio
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [admin, physio]
      fail-fast: false # let both apps build even if one fails

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. Resolve env tag (same logic as backend)
      # ──────────────────────────────────────────
      - name: Resolve image tag from branch
        id: resolve_tag
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            develop)     TAG="dev"    ;;
            staging)     TAG="qa"     ;;
            main|master) TAG="latest" ;;
            *)           TAG="${BRANCH//\//-}" ;;
          esac
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      # ──────────────────────────────────────────
      # 3. Docker Buildx
      # ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ──────────────────────────────────────────
      # 4. Image metadata
      #    Image: frontend_<app>/frontend_<app>
      # ──────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OVH_REGISTRY }}/frontend_${{ matrix.app }}/frontend_${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.resolve_tag.outputs.tag }}

      # ──────────────────────────────────────────
      # 5. Login to OVH registry
      # ──────────────────────────────────────────
      - name: Log in to OVH Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OVH_REGISTRY_URL }}
          username: ${{ secrets.OVH_REGISTRY_USERNAME }}
          password: ${{ secrets.OVH_REGISTRY_PASSWORD }}

      # ──────────────────────────────────────────
      # 6. Build & push (APP_NAME injected via build-arg)
      # ──────────────────────────────────────────
      - name: Build and push Docker image (${{ matrix.app }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_NAME=${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=build-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.app }}

      # ──────────────────────────────────────────
      # 7. Audit trail
      # ──────────────────────────────────────────
      - name: Image digest
        run: |
          echo "App      : ${{ matrix.app }}"
          echo "Branch   : ${{ github.ref_name }}"
          echo "Env tag  : ${{ steps.resolve_tag.outputs.tag }}"
          echo "Digest   : ${{ steps.meta.outputs.digest }}"
