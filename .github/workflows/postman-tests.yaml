name: Run Postman API Tests

on:
  push:
    branches: [ main, develop, postman-ci-test ]
  pull_request:
    branches: [ main, develop, postman-ci-test ]
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run Postman collection
        run: |
          newman run postman/MyCollection.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export reports/newman-report.html \
            --reporter-junit-export reports/newman-report.xml
      - name: Post HTML report to webhook
        if: always()
        run: |
          if [ -f reports/newman-report.html ]; then
            curl -X POST "http://localhost:5678/webhook-test/005c4499-fbf3-48d6-948d-16447ac14a99" \
              -F "file=@reports/newman-report.html;type=text/html" \
              -F "source=github-actions" \
              -F "workflow=${{ github.workflow }}" \
              -F "run_id=${{ github.run_id }}"
          else
            echo "Report file not found: reports/newman-report.html"
            exit 1
          fi
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: reports/