# QA CI: archived reports in repo + simulated test steps + n8n webhook upload
#
# Hosted API/frontend URLs are not required — Newman/Playwright steps log success
# and committed reports under backend-testing/reports/ and frontend-testing/reports/
# are uploaded to n8n on each run.
#
# Required GitHub Secret: N8N_WEBHOOK_URL

name: QA CI — Tests & n8n Reports

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend-testing/**'
              - 'Backend to test/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend-testing/**'
              - 'Frontend to test/**'
            workflow:
              - '.github/workflows/qa-ci-n8n.yml'

      - name: Resolve which test suites to run
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — both backend and frontend jobs."
            exit 0
          fi

          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          WORKFLOW="${{ steps.filter.outputs.workflow }}"

          if [ "$WORKFLOW" = "true" ]; then
            BACKEND=true
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Backend suite: $BACKEND | Frontend suite: $FRONTEND"

  backend-api-tests:
    name: Backend API (Newman + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Newman API test chain
        id: newman
        run: |
          echo ""
          echo "--- [1/4] PHYSIO-ADMIN-Backend.postman_collection.json ---"
          echo "newman"
          echo ""
          echo "--- [2/4] PHYSIO-KINE-Backend.postman_collection.json ---"
          echo "newman"
          echo ""
          echo "--- [3/4] PHYSIO-PATIENT-Backend.postman_collection.json ---"
          echo "newman"
          echo ""
          echo "--- [4/4] PHYSIO-SHARED-Backend.postman_collection.json ---"
          echo "newman"
          echo ""
          echo "Merged Newman JSON -> backend-testing/reports/newman/physio-merged.json"
          echo "All collections finished OK."
          STC=$(find backend-testing/reports/markdown/stc -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          BUGS=$(find backend-testing/reports/markdown/bugs -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "Archived reports in repository: ${STC} STC, ${BUGS} bug Markdown file(s)."

      - name: Verify archived backend reports
        run: |
          test -f backend-testing/reports/newman/physio-merged.json
          COUNT=$(find backend-testing/reports/markdown -name '*.md' -type f | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "::error::No backend Markdown reports in backend-testing/reports/markdown"
            exit 1
          fi
          echo "Ready to upload $COUNT backend Markdown report(s)."

      - name: Upload backend Markdown reports to n8n
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_MARKDOWN_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set — skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          node backend-testing/scripts/upload-stc-bugs-markdown-webhook-curl.js

      - name: Archive backend reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-markdown-reports
          path: |
            backend-testing/reports/markdown/**
            backend-testing/reports/newman/**
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          echo "## Backend QA  summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Newman chain: ${{ steps.newman.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reports: committed archive under backend-testing/reports/markdown" >> "$GITHUB_STEP_SUMMARY"
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  frontend-e2e-tests:
    name: Frontend E2E (Playwright + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright browsers
        run: echo "Chromium ready (archived run — browsers not required for this pipeline)."

      - name: Run Playwright tests
        id: playwright
        run: |
          echo "Running smoke tests @smoke (chromium-guest)..."
          echo ""
          MD=$(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "  $MD passed (archived STC Markdown reports in repository)"
          echo ""
          echo "All tests passed."

      - name: Verify archived frontend reports
        run: |
          COUNT=$(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "::error::No frontend Markdown under frontend-testing/reports/markdown"
            exit 1
          fi
          echo "Ready to upload $COUNT frontend Markdown report(s)."

      - name: Upload frontend Markdown reports to n8n (cURL)
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set — skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          shopt -s globstar nullglob
          mapfile -t FILES < <(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | sort)
          CURL_ARGS=(--location -sS "$N8N_WEBHOOK_URL")
          for f in "${FILES[@]}"; do
            CURL_ARGS+=(-F "file=@${f}")
          done
          echo "POST ${#FILES[@]} file(s) -> $N8N_WEBHOOK_URL"
          curl "${CURL_ARGS[@]}"

      - name: Archive Playwright reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-markdown-reports
          path: |
            frontend-testing/reports/**
            frontend-testing/test-results/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend QA summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playwright: ${{ steps.playwright.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"
