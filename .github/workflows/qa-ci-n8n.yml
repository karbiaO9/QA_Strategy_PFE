# QA automation: Newman + Playwright ? Markdown reports ? n8n webhook
#
# Manual demo mode (workflow_dispatch ? demo_mode: true):
#   - Skips live Newman / Playwright (no API or frontend URL required)
#   - Regenerates Markdown from backend-testing/reports/newman/physio-merged.demo-archive.json
#     (Newman results frozen from before commit "tes")
#   - Uploads reports to n8n and archives artifacts (same pipeline steps, demo-friendly logs)
#
# Required GitHub Secrets:
#   N8N_WEBHOOK_URL
#   KINE_EMAIL / KINE_PASSWORD / KINE_ADMIN_EMAIL / KINE_ADMIN_PASSWORD (frontend, live runs only)

name: QA CI ù Tests & n8n Reports

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Demo mode ù skip live tests, use archived Newman JSON in the repo'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEMO_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.demo_mode == 'true' }}

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend-testing/**'
              - 'Backend to test/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend-testing/**'
              - 'Frontend to test/**'
            workflow:
              - '.github/workflows/qa-ci-n8n.yml'

      - name: Resolve which test suites to run
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            if [ "${{ env.DEMO_MODE }}" = "true" ]; then
              echo "Manual run ? demo mode (backend + frontend pipeline, no live URLs)."
            else
              echo "Manual run ? both backend and frontend suites."
            fi
            exit 0
          fi

          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          WORKFLOW="${{ steps.filter.outputs.workflow }}"

          if [ "$WORKFLOW" = "true" ]; then
            BACKEND=true
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Backend suite: $BACKEND | Frontend suite: $FRONTEND"

  backend-api-tests:
    name: Backend API (Newman + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run Newman API test chain
        if: env.DEMO_MODE != 'true'
        continue-on-error: true
        id: newman
        run: npm run test:physio:chain

      - name: Demo mode ó use archived Newman JSON
        if: env.DEMO_MODE == 'true'
        id: demo-newman
        run: |
          ARCHIVE="backend-testing/reports/newman/physio-merged.demo-archive.json"
          echo "::notice::Demo mode ó skipping live API tests (hosted URLs not required)."
          echo "Using frozen Newman results from before commit \"tes\" (monorepo baseline)."
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Missing demo archive at $ARCHIVE"
            exit 1
          fi
          BYTES=$(wc -c < "$ARCHIVE")
          echo "Demo archive: $ARCHIVE ($BYTES bytes)"

      - name: Generate Markdown STC / bug reports
        if: always()
        run: |
          if [ "${{ env.DEMO_MODE }}" = "true" ]; then
            node backend-testing/scripts/generate-md-reports-from-newman.js reports/newman/physio-merged.demo-archive.json
          else
            npm run report:md:physio
          fi

      - name: Upload backend Markdown reports to n8n
        if: always()
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_MARKDOWN_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set ù skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          node backend-testing/scripts/upload-stc-bugs-markdown-webhook-curl.js

      - name: Archive backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-markdown-reports
          path: |
            backend-testing/reports/markdown/**
            backend-testing/reports/newman/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Backend QA summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ env.DEMO_MODE }}" = "true" ]; then
            echo "- Mode: **demo** (archived Newman JSON, no live API)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Archived JSON: ${{ steps.demo-newman.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Newman chain: ${{ steps.newman.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Markdown reports: backend-testing/reports/markdown" >> "$GITHUB_STEP_SUMMARY"
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Newman tests failed
        if: env.DEMO_MODE != 'true' && steps.newman.outcome == 'failure'
        run: |
          echo "Newman chain reported failures. Download artifacts for STC/bug Markdown reports."
          exit 1

  frontend-e2e-tests:
    name: Frontend E2E (Playwright + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-testing/package-lock.json

      - name: Install frontend-testing dependencies
        working-directory: frontend-testing
        run: npm ci

      - name: Install Playwright browsers
        if: env.DEMO_MODE != 'true'
        working-directory: frontend-testing
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: env.DEMO_MODE != 'true'
        continue-on-error: true
        id: playwright
        working-directory: frontend-testing
        env:
          CI: 'true'
          BASE_URL: ${{ vars.BASE_URL || 'https://kine.physio.agregatech.com' }}
          KINE_EMAIL: ${{ secrets.KINE_EMAIL }}
          KINE_PASSWORD: ${{ secrets.KINE_PASSWORD }}
          KINE_ADMIN_EMAIL: ${{ secrets.KINE_ADMIN_EMAIL }}
          KINE_ADMIN_PASSWORD: ${{ secrets.KINE_ADMIN_PASSWORD }}
          PROJECT_NAME: Application under test
          TESTER_NAME: GitHub Actions
        run: npm run test:smoke

      - name: Demo mode ù skip Playwright tests
        if: env.DEMO_MODE == 'true'
        id: demo-playwright
        run: |
          echo "::notice::Demo mode ù skipping Playwright (no live frontend URL required)."
          echo "Frontend webhook upload will run only if committed .md files exist under frontend-testing/reports/markdown/."

      - name: Upload frontend Markdown reports to n8n (cURL)
        if: always()
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set ù skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          shopt -s globstar nullglob
          mapfile -t FILES < <(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No frontend Markdown reports found."
            exit 0
          fi
          CURL_ARGS=(--location -sS "$N8N_WEBHOOK_URL")
          for f in "${FILES[@]}"; do
            CURL_ARGS+=(-F "file=@${f}")
          done
          echo "POST ${#FILES[@]} file(s) ? $N8N_WEBHOOK_URL"
          curl "${CURL_ARGS[@]}"

      - name: Archive Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-reports
          path: |
            frontend-testing/reports/**
            frontend-testing/test-results/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend QA summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ env.DEMO_MODE }}" = "true" ]; then
            echo "- Mode: **demo** (Playwright skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Playwright: ${{ steps.playwright.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Playwright tests failed
        if: env.DEMO_MODE != 'true' && steps.playwright.outcome == 'failure'
        run: exit 1
