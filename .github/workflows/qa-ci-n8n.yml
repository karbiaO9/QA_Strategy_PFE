# QA automation: Newman + Playwright ? Markdown reports ? n8n webhook
#
# Manual demo recording (workflow_dispatch):
#   demo_mode=true                   ? skip live API/UI tests (dead URLs OK)
#   demo_use_committed_markdown=true ? upload committed .md as-is (exact old reports)
#   demo_use_committed_markdown=false ? regenerate .md from archived physio-merged.json
#
# Required GitHub Secrets: N8N_WEBHOOK_URL (+ frontend credentials for live runs)

name: QA CI � Tests & n8n Reports

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-testing/**'
      - 'frontend-testing/**'
      - 'Backend to test/**'
      - 'Frontend to test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa-ci-n8n.yml'
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Demo mode � skip live API/UI tests; use archived data in repo'
        type: boolean
        default: false
      demo_use_committed_markdown:
        description: 'Demo only � upload committed Markdown as-is (no regeneration)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      demo_mode: ${{ steps.scope.outputs.demo_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'backend-testing/**'
              - 'Backend to test/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend-testing/**'
              - 'Frontend to test/**'
            workflow:
              - '.github/workflows/qa-ci-n8n.yml'

      - name: Resolve which test suites to run
        id: scope
        run: |
          DEMO="${{ github.event_name == 'workflow_dispatch' && inputs.demo_mode == true && 'true' || 'false' }}"
          echo "demo_mode=$DEMO" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            if [ "$DEMO" = "true" ]; then
              echo "Manual demo run ? both jobs; live tests skipped."
            else
              echo "Manual run ? both backend and frontend suites."
            fi
            exit 0
          fi

          BACKEND="${{ steps.filter.outputs.backend }}"
          FRONTEND="${{ steps.filter.outputs.frontend }}"
          WORKFLOW="${{ steps.filter.outputs.workflow }}"

          if [ "$WORKFLOW" = "true" ]; then
            BACKEND=true
            FRONTEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Backend suite: $BACKEND | Frontend suite: $FRONTEND"

  backend-api-tests:
    name: Backend API (Newman + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run Newman API test chain
        if: needs.detect-changes.outputs.demo_mode != 'true'
        continue-on-error: true
        id: newman
        run: npm run test:physio:chain

      - name: Demo mode � use archived Newman JSON
        if: needs.detect-changes.outputs.demo_mode == 'true'
        id: newman
        run: |
          echo "::notice::Demo mode: skipping live API tests (hosted URLs not required)."
          JSON="backend-testing/reports/newman/physio-merged.json"
          if [ ! -f "$JSON" ]; then
            echo "::error::Missing archived Newman JSON at $JSON"
            echo "Commit physio-merged.json or download it from a prior workflow artifact."
            exit 1
          fi
          BYTES=$(wc -c < "$JSON" | tr -d ' ')
          echo "Using archived results: $JSON ($BYTES bytes)"
          echo "Source: committed snapshot in repository (not a live API run)."

      - name: Generate Markdown STC / bug reports
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.demo_mode == true && inputs.demo_use_committed_markdown == true)
        run: npm run report:md:physio

      - name: Demo mode � use committed Markdown reports
        if: github.event_name == 'workflow_dispatch' && inputs.demo_mode == true && inputs.demo_use_committed_markdown == true
        run: |
          echo "::notice::Demo mode: using committed Markdown reports (no regeneration)."
          COUNT=$(find backend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "::error::No committed .md files under backend-testing/reports/markdown"
            exit 1
          fi
          echo "Found $COUNT committed Markdown report(s)."

      - name: Upload backend Markdown reports to n8n
        if: always()
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_MARKDOWN_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set � skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          node backend-testing/scripts/upload-stc-bugs-markdown-webhook-curl.js

      - name: Archive backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-markdown-reports
          path: |
            backend-testing/reports/markdown/**
            backend-testing/reports/newman/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Backend QA summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.detect-changes.outputs.demo_mode }}" = "true" ]; then
            echo "- **Demo mode:** yes" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ inputs.demo_use_committed_markdown }}" = "true" ]; then
              echo "- Reports: committed Markdown (no regeneration)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Reports: regenerated from archived physio-merged.json" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "- Newman chain: ${{ steps.newman.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Markdown reports: backend-testing/reports/markdown" >> "$GITHUB_STEP_SUMMARY"
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Newman tests failed
        if: steps.newman.outcome == 'failure' && needs.detect-changes.outputs.demo_mode != 'true'
        run: |
          echo "Newman chain reported failures. Download artifacts for STC/bug Markdown reports."
          exit 1

  frontend-e2e-tests:
    name: Frontend E2E (Playwright + Markdown)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-testing/package-lock.json

      - name: Install frontend-testing dependencies
        if: needs.detect-changes.outputs.demo_mode != 'true'
        working-directory: frontend-testing
        run: npm ci

      - name: Install Playwright browsers
        if: needs.detect-changes.outputs.demo_mode != 'true'
        working-directory: frontend-testing
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: needs.detect-changes.outputs.demo_mode != 'true'
        continue-on-error: true
        id: playwright
        working-directory: frontend-testing
        env:
          CI: 'true'
          BASE_URL: ${{ vars.BASE_URL || 'https://kine.physio.agregatech.com' }}
          KINE_EMAIL: ${{ secrets.KINE_EMAIL }}
          KINE_PASSWORD: ${{ secrets.KINE_PASSWORD }}
          KINE_ADMIN_EMAIL: ${{ secrets.KINE_ADMIN_EMAIL }}
          KINE_ADMIN_PASSWORD: ${{ secrets.KINE_ADMIN_PASSWORD }}
          PROJECT_NAME: Application under test
          TESTER_NAME: GitHub Actions
        run: npm run test:smoke

      - name: Demo mode � skip Playwright (no live frontend)
        if: needs.detect-changes.outputs.demo_mode == 'true'
        id: playwright
        run: |
          echo "::notice::Demo mode: skipping live UI tests (hosted frontend not required)."
          MD_COUNT=$(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$MD_COUNT" = "0" ]; then
            echo "No frontend Markdown in repo (expected � frontend reports are usually CI-only)."
            echo "Backend demo + n8n upload still runs; frontend artifact may be empty."
          else
            echo "Found $MD_COUNT committed frontend Markdown file(s) for upload."
          fi

      - name: Upload frontend Markdown reports to n8n (cURL)
        if: always()
        continue-on-error: true
        id: webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::notice::N8N_WEBHOOK_URL secret not set � skipping webhook upload."
            exit 0
          fi
          if echo "$N8N_WEBHOOK_URL" | grep -qiE 'localhost|127\.0\.0\.1'; then
            echo "::warning::N8N_WEBHOOK_URL points to localhost. Skipping upload from cloud runner."
            exit 0
          fi
          shopt -s globstar nullglob
          mapfile -t FILES < <(find frontend-testing/reports/markdown -name '*.md' -type f 2>/dev/null | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No frontend Markdown reports found � skipping frontend n8n upload."
            exit 0
          fi
          CURL_ARGS=(--location -sS "$N8N_WEBHOOK_URL")
          for f in "${FILES[@]}"; do
            CURL_ARGS+=(-F "file=@${f}")
          done
          echo "POST ${#FILES[@]} file(s) ? $N8N_WEBHOOK_URL"
          curl "${CURL_ARGS[@]}"

      - name: Archive Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-reports
          path: |
            frontend-testing/reports/**
            frontend-testing/test-results/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## Frontend QA summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.detect-changes.outputs.demo_mode }}" = "true" ]; then
            echo "- **Demo mode:** yes (Playwright skipped)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Playwright: ${{ steps.playwright.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- n8n webhook: ${{ steps.webhook.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if Playwright tests failed
        if: steps.playwright.outcome == 'failure' && needs.detect-changes.outputs.demo_mode != 'true'
        run: exit 1
